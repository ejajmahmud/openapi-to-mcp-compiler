[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-to-mcp-compiler"
version = "0.1.0"
description = "Automatic schema converter translating OpenAPI 3.0/3.1 JSON/YAML endpoint specifications into native MCP tool manifests"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
openapi-to-mcp-compiler = "openapi_to_mcp_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openapi_to_mcp_compiler*"]
